name: Build iOS Application

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    name: Compile & Package iOS App
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Workspace (Unsigned IPA / App Bundle)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload as IPA
        run: |
          cd ios/App/build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -r App.app Payload/
          zip -r BrilliantBudget.ipa Payload
          mv BrilliantBudget.ipa $GITHUB_WORKSPACE/

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrilliantBudget-iOS
          path: BrilliantBudget.ipa
          retention-days: 14
